name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: https://engineeringfoundry.dev
      NEXT_PUBLIC_DISCORD_URL: https://discord.gg/cNgNq3AFGX
      NEXT_PUBLIC_ACCOUNTS_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test content validator
        run: npm run test:content-validator
      - name: Test interview content validator
        run: npm run test:interview-content-validator
      - name: Test mock content validator
        run: npm run test:mock-content-validator
      - name: Test referral privacy boundary
        run: npm run test:referral-privacy
      - name: Test challenge worksheet privacy
        run: npm run test:challenge-privacy
      - name: Test recognition integrity
        run: npm run test:recognition-integrity
      - name: Test experience privacy boundary
        run: npm run test:experience-privacy
      - name: Test experience fabrication integrity
        run: npm run test:experience-integrity
      - name: Test public launch integrity
        run: npm run test:public-launch-integrity
      - name: Test authentication foundation
        run: npm run test:auth-foundation
      - name: Test Applications workspace
        run: npm run test:application-tracker
      - name: Test Behavioral workspace
        run: npm run test:behavioral-workspace
      - name: Test Behavioral v1 polish
        run: npm run test:behavioral-v1-polish
      - name: Test analytics and launch evidence
        run: npm run test:analytics-launch-evidence
      - name: Validate impact ledger integrity
        run: npm run validate:impact-ledger
      - name: Test Feedback and admin operations
        run: npm run test:feedback-admin-operations
      - name: Test interview preparation hub
        run: npm run test:interview-preparation-hub
      - name: Test interview execution taxonomy
        run: npm run test:interview-execution-taxonomy
      - name: Test Interview Playbook diagnostic evidence model
        run: npm run test:interview-playbook-diagnostic
      - name: Test Interview Playbook mock evidence boundary
        run: npm run test:interview-playbook-mock-evidence
      - name: Test Interview Playbook adaptive planning engine
        run: npm run test:interview-playbook-planning
      - name: Test Interview Playbook planner product integration
        run: npm run test:interview-playbook-planner-integration
      - name: Test Interview Playbook DSA evidence boundary
        run: npm run test:interview-playbook-dsa-evidence
      - name: Test Interview Playbook System Design evidence boundary
        run: npm run test:interview-playbook-system-design-evidence
      - name: Test Interview Playbook diagnostic inputs
        run: npm run test:interview-playbook-diagnostic-inputs
      - name: Test interview calendar and reminders
        run: npm run test:interview-calendar-reminders
      - name: Test reminder worker delivery outcomes
        run: npm run test:interview-reminder-worker
      - name: Test account lifecycle
        run: npm run test:account-lifecycle
      - name: Test production hardening
        run: npm run test:production-hardening
      - name: Test production baseline
        run: npm run test:production-baseline
      - name: Test private-route privacy boundary
        run: npm run test:private-route-privacy
      # Mandatory launch guard: the application must not be able to offer a
      # canonical ID the database would refuse to persist.
      - name: Test canonical catalog integrity
        run: npm run test:canonical-catalog-integrity
      - name: Test authenticated persistence foundation
        run: npm run test:persistence-foundation
      - name: Test unified preparation progress
        run: npm run test:unified-progress
      - name: Test UI density guardrails
        run: npm run test:ui-density
      - name: Test typography readability
        run: npm run test:typography-readability
      - name: Test DSA persistent progress
        run: npm run test:dsa-progress
      - name: Test System Design practice workspace
        run: npm run test:system-design-workspace
      - name: Test homepage entry experience
        run: npm run test:homepage-entry
      - name: Test System Design learning architecture
        run: npm run test:system-design-learning
      - name: Test System Design entry experience
        run: npm run test:system-design-entry
      - name: Test System Design manifest
        run: npm run test:system-design-manifest
      - name: Test System Design recommendations
        run: npm run test:system-design-recommendations
      - name: Test System Design study plans
        run: npm run test:system-design-study-plan
      - name: Test System Design curriculum content
        run: |
          npm run test:system-design-foundations
          npm run test:system-design-networking
          npm run test:system-design-data-storage
          npm run test:system-design-caching
          npm run test:system-design-messaging
          npm run test:system-design-reliability
          npm run test:system-design-specialized
          npm run test:system-design-technology
          npm run test:system-design-practice
          npm run test:system-design-release-audit
      - name: Test DSA interview-preparation architecture
        run: npm run test:dsa-interview-prep
      - name: Test DSA roadmap architecture
        run: npm run test:dsa-roadmap
      - name: Test DSA level roadmaps and planning
        run: |
          npm run test:dsa-level-roadmaps
          npm run test:dsa-roadmap-planning
      - name: Test DSA study-plan architecture
        run: npm run test:dsa-study-plans
      - name: Test DSA language references
        run: npm run test:dsa-languages
      - name: Test DSA coding interview strategy
        run: npm run test:dsa-strategy
      - name: Test company interview guides
        run: npm run test:company-interview-guide
      - name: Validate content
        run: npm run validate:content
      - name: Validate design content
        run: npm run validate:design-content
      - name: Validate interview content
        run: npm run validate:interview-content
      - name: Validate mock content
        run: npm run validate:mock-content
      - name: Validate referral content
        run: npm run validate:referral-content
      - name: Validate community content
        run: npm run validate:community-content
      - name: Validate experience content
        run: npm run validate:experience-content
      - name: Validate public links
        run: npm run validate:public-links
      - name: Build
        run: npm run build
      - name: Smoke public routes
        run: npm run test:public-routes

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start local Supabase
        run: npx --yes supabase start
      - name: Apply every migration from scratch
        run: npx --yes supabase db reset --local
      - name: Lint the public database schema
        run: npx --yes supabase db lint --local --schema public --level warning --fail-on error
      - name: Run database policy and integrity tests
        run: npx --yes supabase test db
      - name: Qualify two-user Data API isolation
        run: |
          eval "$(npx --yes supabase status -o env | sed -n 's/^ANON_KEY=/export NEXT_PUBLIC_SUPABASE_ANON_KEY=/p; s/^API_URL=/export NEXT_PUBLIC_SUPABASE_URL=/p; s/^SERVICE_ROLE_KEY=/export SUPABASE_SERVICE_ROLE_KEY=/p')"
          npm run qualify:persistence-local
          npm run qualify:account-lifecycle-local
          npm run qualify:auth-local
          npm run qualify:security-local
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase stop
